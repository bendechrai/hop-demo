schema: spec-driven

# Project context: constraints an agent cannot infer from the code.
context: |
  TypeScript with no build step. Node runs the .ts files directly.
  Code has three layers. A request flows routes, then actions, then services. Nothing flows sideways.
  - Routes (src/routes/) parse the request, call one action and shape the response.
  - Actions (src/actions/) hold the business rules and return a result that says what went wrong in plain words.
  - Services (src/services/) do the mechanics: database queries, file access, code generation.
  Schema changes are numbered SQL migrations in migrations/. Never edit an old one.
  Work is not done until every gate in DEFINITION_OF_DONE.md passes or is waived in writing.
  Tests sit beside the layer they test. Action tests use a fake service. Service tests use a throwaway database.
  Writing style is plain words, short sentences and only characters on a standard keyboard.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - "agentboard: Before implementing a task group, claim its ticket: find it with `agentboard list --change <change>` and run `agentboard claim <id> --as <you>`. If the change has no tickets yet, run `agentboard import-change <change> --as <you>` first." # agentboard-guidance: v1
      - "agentboard: Before you stop, hand the ticket off with `agentboard handoff <id> --to <next> --status <status> --note \"<what is done>\" --as <you>`, or say why with `agentboard comment <id> \"<why>\" --as <you>` and block it with `agentboard move <id> blocked --as <you>`." # agentboard-guidance: v1
      - "agentboard: Tick finished tasks in tasks.md in the implementing pull request; the board is not the record of completion. Run `agentboard help agents` for the full guide." # agentboard-guidance: v1
  archive:
    guidance:
      - "agentboard: Run `agentboard close-merged --as <you>` first, then check with `agentboard list --change <change>` that no ticket of the change is still open; do not archive while one is." # agentboard-guidance: v1
      - "agentboard: Promote every DECISION: comment on the change tickets to a spec delta or ADR before archiving." # agentboard-guidance: v1
